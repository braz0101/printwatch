services:
  collector:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./config.toml:/app/config.toml:ro
      - ./printers.csv:/app/printers.csv:ro
      - ./data:/app/data
    # Pas de port exposé : le collecteur n'écoute rien.
    read_only: true
    tmpfs:
      - /tmp                     # snmp.conf temporaire (0600) : jamais écrit sur disque persistant
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  web:
    build: .
    restart: unless-stopped
    command: ["--config", "/app/config.toml", "serve", "--host", "0.0.0.0", "--port", "8080"]
    depends_on: [collector]
    # Aucun secret SNMP/SMTP : le dashboard ne contacte jamais les imprimantes. Connexion obligatoire : comptes dans data/users.json
    # (docker compose run --rm web --config /app/config.toml users add --temp --role admin prenom.nom@exemple.sn) ; droits par rôle.
    # Répartition des tickets GLPI : passer GLPI_CLIENT_SECRET et GLPI_PASSWORD au seul service web (le coffre DPAPI est propre à Windows).
    # environment: ["PRINTWATCH_ALLOWED_HOSTS", "GLPI_CLIENT_SECRET", "GLPI_PASSWORD"]   # ALLOWED_HOSTS : nom public derrière le proxy
    volumes:
      - ./config.toml:/app/config.toml:ro
      # Écriture requise par le mode WAL (fichier -shm). La lecture seule est garantie par le code :
      # connexion SQLite ouverte en mode=ro.
      - ./data:/app/data
    # Publié sur la boucle locale de la VM uniquement. Pour l'exposer : proxy inverse (TLS + authentification)
    # sur la VM, jamais de mapping vers 0.0.0.0.
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
